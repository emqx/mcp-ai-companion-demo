services:
  volc-server:
    build:
      context: ./volc-server
    container_name: mcp-volc-server
    env_file:
      - volc-server/.env
    environment:
      NODE_ENV: production
    labels:
      app: volc-server
      project: mcp-ai-companion
    ports:
      - "3002:3002"

  web:
    build:
      context: ./web
      args:
        VITE_AIGC_PROXY_HOST: ${VITE_AIGC_PROXY_HOST:-http://localhost:3002}
    depends_on:
      - volc-server
    container_name: mcp-web
    labels:
      app: web-ui
      project: mcp-ai-companion
    ports:
      - "8080:80"
